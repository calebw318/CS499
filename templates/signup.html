<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SPE Data Collection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="container">
        <h1>Create an Account</h1>
        <form id="signup" method="post" action="/api/signup">
            <label for="username">Email:</label>
            <input id="username" name="username" type="email" placeholder="first.last@uky.edu" required>
            <br>
            <label for="password">Password:</label>
            <input id="password" name="password" type="password" placeholder="password1234" required>
            <br>
            <label for="confirmPassword">Confirm Password:</label>
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="password1234" required>
            <br>
            <button type="submit">Sign Up</button>
        </form>
        <p style="margin-top: 16px;">Already have an account? <a href="/">Log in</a></p>
        <div id="signup-error" class="error" role="alert" aria-live="polite" style="display:none"></div>
        <div id="signup-success" class="success" role="status" style="display:none"></div>
    </div>
    <script src="{{ url_for('static', filename='js/signup.js') }}"></script>
</body>
</html>
